name: CI

"on":
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'shared/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.base.json'
              - 'eslint.config.js'
              - '.github/workflows/ci.yml'
            web:
              - 'apps/web/**'
              - 'shared/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.base.json'
              - 'eslint.config.js'
              - '.github/workflows/ci.yml'

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        working-directory: .
      - run: npm run lint --workspace=apps/api
        working-directory: .
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test
      # Blocks only on critical CVEs so this doesn't go red over the
      # existing high/moderate transitive findings tracked via Dependabot
      # (several need a breaking NestJS major bump to clear) — see
      # docs/dcms-security-hardening.md. Informational step below reports
      # the full picture without failing the build.
      - run: npm audit --omit=dev --audit-level=critical -w apps/api
        working-directory: .
      - run: npm audit --omit=dev -w apps/api
        working-directory: .
        continue-on-error: true

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        working-directory: .
      - run: npm run lint --workspace=apps/web
        working-directory: .
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test
      - run: npm audit --omit=dev --audit-level=critical -w apps/web
        working-directory: .
      - run: npm audit --omit=dev -w apps/web
        working-directory: .
        continue-on-error: true